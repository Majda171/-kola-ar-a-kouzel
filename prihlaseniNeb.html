<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="prihlaseni.css">
  <title>Nebelvír — vstup</title>
<link rel="stylesheet" href="ghosts.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=42"></script>
<link rel="stylesheet" href="access-guard.css?v=42"><script src="access-guard.js?v=42"></script>
<link rel="stylesheet" href="magic-cursor.css">
<link rel="stylesheet" href="v40.css"><link rel="stylesheet" href="music-v42.css?v=42"></head>
<body>
<main class="entry-page gryff">
  <a class="back-link" href="hrad.html">← Mapa hradu</a>
  <section class="scene gryff-scene">
    <img class="wall-torch torch-small torch-left" src="img/torch-gryffindor.webp" alt="" aria-hidden="true">
    <img class="wall-torch torch-small torch-right" src="img/torch-gryffindor.webp" alt="" aria-hidden="true">


    <img class="ambient-painting painting-a" src="img/portrait-rytir.webp" alt="" aria-hidden="true">
    <img class="ambient-painting painting-b" src="img/portrait-alchymista.webp" alt="" aria-hidden="true">
    <img class="ambient-painting painting-c" src="img/portrait-pasacka.webp" alt="" aria-hidden="true">
    <img class="ambient-painting painting-d" src="img/portrait-hrad-new.webp" alt="" aria-hidden="true">

    <button class="scene-image-button portrait-art" id="portraitTrigger" data-audio="ladyAudio" aria-label="Promluvit s Baculatou dámou">
      <img src="img/baculata-dama.webp" alt="Portrét Baculaté dámy ve zlatém rámu">
    </button>
    <audio id="ladyAudio" src="audio/17263316147690gx3mtca-voicemaker.in-speech.mp3" preload="metadata"></audio>

    <div class="reveal-panel portrait-password" id="loginPanel" hidden>
      <form id="loginForm">
        <label class="sr-only" for="password">Heslo</label>
        <input id="password" autocomplete="off" placeholder="Heslo…" required>
        <button type="submit">Vyslovit</button>
      </form>
      <p id="errorMessage" class="error-message" aria-live="polite"></p>
    </div>
  </section>
</main>
<script src="achievements.js"></script><script src="entry.js"></script>
<script>
  const portrait = document.getElementById('portraitTrigger');
  const weekly = window.BradaviceAchievements?.getWeeklyEntry('N');
  revealForm('#portraitTrigger','#loginPanel',{onReveal:()=>portrait.classList.add('listening')});
  setupPasswordForm({
    formId:'loginForm',inputId:'password',errorId:'errorMessage',
    answers:weekly?.answers||['Nimbulus Nimbletonia'],
    successUrl:'Nebelvir.html',
    wrongText:'Baculatá dáma jen pozvedne obočí.',
    onSuccess:()=>{window.BradaviceAchievements?.award('dama-otevrela');window.BradaviceAchievements?.award('znalec-hesel',{silent:true})}
  });
</script>
<script src="ghosts.js"></script>
<script src="music-v42.js?v=42"></script></body>
</html>
