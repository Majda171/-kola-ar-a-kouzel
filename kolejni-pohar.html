<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kolejní pohár — Bradavice</title><link rel="stylesheet" href="portal.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=4367"></script><link rel="stylesheet" href="access-guard.css?v=435"><script src="access-guard.js?v=435"></script><link rel="stylesheet" href="magic-cursor.css"><style>
*{box-sizing:border-box}.cup-page{min-height:100vh;padding:72px 4vw 38px;color:#e8dec5;background:linear-gradient(rgba(3,4,3,.15),rgba(3,4,3,.48)),url('img/kolejni-body-bg.webp') center/cover fixed;position:relative;overflow:hidden}.cup-page::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 34%,transparent 0 28%,rgba(0,0,0,.18) 68%,rgba(0,0,0,.45))}.cup-top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;padding:17px 4vw;background:linear-gradient(rgba(5,7,5,.88),transparent);font-family:'Cinzel';font-size:.58rem;letter-spacing:.14em;text-transform:uppercase}.cup-top a{color:#d7c69a;text-decoration:none}.cup-head{position:relative;z-index:2;text-align:center;max-width:660px;margin:0 auto 24px;padding:10px 18px 12px;background:rgba(5,7,5,.54);border:1px solid rgba(204,173,101,.18);backdrop-filter:blur(3px)}.cup-head h1{font-family:'Cinzel';font-size:clamp(1.4rem,3vw,2.35rem);letter-spacing:.09em;margin:0;color:#eee1c2}.cup-head p{margin:5px 0 0;color:#a99e88;font-size:.88rem}.house-ranking{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:16px;align-items:end;max-width:1080px;margin:0 auto}.house-column{position:relative;min-height:390px;border:1px solid rgba(212,184,112,.24);background:linear-gradient(180deg,rgba(8,10,8,.58),rgba(5,7,5,.82));display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:18px 12px 20px;overflow:hidden;box-shadow:0 22px 48px rgba(0,0,0,.36);backdrop-filter:blur(2px)}.house-column::before{content:"";position:absolute;inset:-8% -12% 32%;background:var(--crest) center/contain no-repeat;opacity:.19;filter:grayscale(.16) brightness(.72);transform:scale(1.12)}.house-column.leader{border-color:rgba(226,194,108,.58);box-shadow:0 0 32px rgba(209,169,67,.08),0 24px 55px rgba(0,0,0,.44)}.house-fill{position:absolute;left:0;right:0;bottom:0;height:var(--fill);opacity:.22;background:linear-gradient(180deg,transparent,var(--house));transition:height .7s ease}.house-column img{position:relative;z-index:2;width:min(108px,62%);height:108px;object-fit:contain;filter:drop-shadow(0 12px 18px #000)}.house-column h2{position:relative;z-index:2;font-family:'Cinzel';font-size:.86rem;letter-spacing:.08em;margin:10px 0 4px}.house-points{position:relative;z-index:2;font-family:'Cinzel';font-size:1.85rem;color:#e0c477}.house-label{position:relative;z-index:2;color:#948974;font-size:.74rem}.rank{position:absolute;top:12px;left:12px;z-index:3;padding:5px 8px;border:1px solid rgba(207,177,106,.28);background:rgba(4,5,4,.62);font-family:'Cinzel';font-size:.55rem;color:#c9ad6b}.cup-note{position:relative;z-index:2;text-align:center;color:#7f7768;font-size:.76rem;margin:20px 0 0}@media(max-width:840px){.house-ranking{grid-template-columns:repeat(2,1fr);max-width:680px}.house-column{min-height:300px}}@media(max-width:480px){.cup-page{padding-inline:3vw}.house-ranking{gap:8px}.house-column{min-height:260px;padding:10px}.house-column img{height:82px}.house-points{font-size:1.45rem}.cup-head{margin-bottom:14px}}
</style><link rel="stylesheet" href="v40.css"><link rel="stylesheet" href="music-v42.css?v=435"><link rel="stylesheet" href="castle-nav-v42.css?v=435"><link rel="stylesheet" href="ui-v435.css?v=4352">
</head><body><header class="cup-top"><a href="hrad.html">← Mapa hradu</a><a href="profil.html">Můj profil</a></header><main class="cup-page"><section class="cup-head"><h1>Kolejní pohár</h1><p>Průběžné pořadí podle skutečně získaných bodů studentů.</p></section><section class="house-ranking" id="houseRanking"></section><p class="cup-note">Pořadí se načítá ze společné databáze přihlášených studentů.</p></main><script>
(async()=>{
const houses=[['N','Nebelvír','img/nebelvir-erb.webp','#692828'],['H','Havraspár','img/havraspar-erb.webp','#233f66'],['M','Mrzimor','img/mrzimor-erb.webp','#80691f'],['Z','Zmijozel','img/zmijozel-erb.webp','#1f5039']];
let standings=null;try{standings=await window.BradaviceDB?.getHouseStandings?.()}catch(e){console.warn('Pořadí kolejí se nepodařilo načíst z databáze.',e)}
const dbMap=Object.fromEntries((standings||[]).map(r=>[r.house_code,Number(r.total_points||0)]));
const data=houses.map(([code,name,img,color])=>({code,name,img,color,points:standings?Number(dbMap[code]||0):Number(localStorage.getItem(`bradavice_house_points_v2_${code}`)||0)})).sort((a,b)=>b.points-a.points||['N','H','M','Z'].indexOf(a.code)-['N','H','M','Z'].indexOf(b.code));
const max=Math.max(1,...data.map(x=>x.points));
document.getElementById('houseRanking').innerHTML=data.map((h,i)=>`<article class="house-column ${i===0&&h.points>0?'leader':''}" style="--fill:${Math.max(4,h.points/max*78)}%;--house:${h.color};--crest:url('${h.img}')"><span class="rank">${i+1}. místo</span><div class="house-fill"></div><img src="${h.img}" alt="Erb ${h.name}"><h2>${h.name}</h2><div class="house-points">${h.points}</div><div class="house-label">bodů</div></article>`).join('');
})();
</script><script src="music-v42.js?v=435"></script><script src="castle-nav-v435.js?v=435"></script><script src="ui-v435.js?v=4352"></script>
</body></html>
